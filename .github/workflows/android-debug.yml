name: Android Debug

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies
        working-directory: apps/android
        run: npm ci --workspaces=false --include=dev

      - name: Debug Capacitor CLI installation
        run: ls -la apps/android/node_modules/.bin/ | head -20

      - name: Add Android platform
        working-directory: apps/android
        run: ./node_modules/.bin/cap add android

      - name: Sync Capacitor
        working-directory: apps/android
        run: ./node_modules/.bin/cap sync android

      - name: Apply Plutão Android branding
        working-directory: apps/android
        run: node scripts/apply-branding.mjs

      - name: Make Gradle wrapper executable
        working-directory: apps/android/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: plutao-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
