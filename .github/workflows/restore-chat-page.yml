name: restore-chat-page
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode zlib payload and commit
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          raw = pathlib.Path("apps/web/src/app/(app)/chat/page.tsx.zlib.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(raw))
          pathlib.Path("apps/web/src/app/(app)/chat/page.tsx").write_bytes(data)
          print("restored", len(data), "bytes")
          PY
          git config user.name "plutao-bot"
          git config user.email "bot@plutao.local"
          git add "apps/web/src/app/(app)/chat/page.tsx"
          git commit -m "fix(chat): restore page with WriteGateCard GATE_PENDING integration"
          git push
