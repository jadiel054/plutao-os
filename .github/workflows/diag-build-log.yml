name: Diag build log

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  actions: read
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI run then fetch failed log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          RUN_ID=""
          for t in $(seq 1 12); do
            RUN_ID=$(gh api "repos/jadiel054/plutao-os/actions/runs?head_sha=$HEAD_SHA" --jq ".workflow_runs[] | select(.name == \"CI\") | .id" | head -n1 || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          echo "RUN_ID=$RUN_ID"
          for i in $(seq 1 40); do
            ST=$(gh api "repos/jadiel054/plutao-os/actions/runs/$RUN_ID" --jq .status)
            echo "status=$ST ($i)"
            if [ "$ST" = "completed" ]; then break; fi
            sleep 15
          done
          gh api "repos/jadiel054/plutao-os/actions/runs/$RUN_ID/logs" > /tmp/cilogs.zip || true
          rm -rf /tmp/cilogs && mkdir -p /tmp/cilogs && (unzip -o /tmp/cilogs.zip -d /tmp/cilogs || true)
          echo "--- arquivos ---" > /tmp/diag.txt
          ls /tmp/cilogs >> /tmp/diag.txt 2>/dev/null || true
          echo "--- job build (tail) ---" >> /tmp/diag.txt
          CAT=$(ls /tmp/cilogs | grep -i build | head -1)
          if [ -n "$CAT" ]; then tail -c 6000 "/tmp/cilogs/$CAT" >> /tmp/diag.txt; else echo "(nenhum log de build)"; fi
      - name: Publish to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/diag.txt || true
