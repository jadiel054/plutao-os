name: Diag build log

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web (diagnostic)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          NODE_ENV=production npm run build -w apps/web 2>&1 | tee /tmp/webbuild.log
      - name: Publish build tail to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/webbuild.log > /tmp/webtail.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/webtail.txt || true
