name: Diag build log

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/install.log
      - name: Build web (diagnostic)
        continue-on-error: true
        run: |
          set -o pipefail
          NODE_ENV=production npm run build -w apps/web 2>&1 | tee /tmp/webbuild.log
      - name: Publish logs to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "=== INSTALL TAIL ==="; tail -c 2500 /tmp/install.log 2>/dev/null || echo "(sem log de install)"; echo; echo "=== BUILD WEB TAIL ==="; tail -c 6000 /tmp/webbuild.log 2>/dev/null || echo "(sem log de build)"; } > /tmp/diag.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/diag.txt || true
