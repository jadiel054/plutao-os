name: Wire model resolve

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/wire-model-resolve.cjs"
      - "apps/web/src/lib/runtime/model/resolveConfig.ts"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/wire-model-resolve.cjs
      - name: Commit
        run: |
          git config user.name "plutao-bot"
          git config user.email "bot@plutao.local"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(model): chat e /api/model/test usam resolveCloudModelConfig"
            git push
          fi
