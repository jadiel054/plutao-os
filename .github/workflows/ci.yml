name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm run test

      - name: Build web
        run: npm run build -w apps/web
        env:
          # Build must not require live DB; /api/health skips without DATABASE_URL
          NODE_ENV: production

      - name: Lockfile status
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json present"
          else
            echo "WARN: package-lock.json missing — commit after first successful local npm install"
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plutao
          POSTGRES_PASSWORD: plutao
          POSTGRES_DB: plutao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://plutao:plutao@localhost:5432/plutao_test
      RUN_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Integration tests (real PostgreSQL)
        run: |
          set -o pipefail
          npx vitest run apps/web/src/lib/runtime/__tests__/pg --reporter=verbose 2>&1 | tee /tmp/pg-tests.log

      - name: Publish failure log to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/pg-tests.log > /tmp/pg-tail.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/pg-tail.txt || true
