name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build -w apps/web
        env:
          # Build must not require live DB; health skips without DATABASE_URL
          NODE_ENV: production

      - name: Check lockfile present
        run: test -f package-lock.json && echo "package-lock.json OK"
