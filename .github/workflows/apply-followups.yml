name: Apply follow-ups patch

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch-followups.mjs"
      - "apps/web/src/lib/chat/buildFollowUps.ts"
      - "apps/web/src/components/chat/FollowUpChips.tsx"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch script
        run: node scripts/patch-followups.mjs
      - name: Commit if changed
        run: |
          git config user.name "plutao-bot"
          git config user.email "bot@plutao.local"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat(chat): wire suggestedFollowUps no route e chips no chat"
            git push
          fi
