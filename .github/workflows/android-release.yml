name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate and derive version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION_NAME="${TAG#v}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH with optional prerelease suffix"
            exit 1
          fi
          VERSION_CODE="$(git rev-list --count "$COMMIT_SHA" -- apps/android)"
          if [ "$VERSION_CODE" -lt 1 ]; then VERSION_CODE=1; fi
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Install Android dependencies
        working-directory: apps/android
        run: npm ci --workspaces=false --include=dev

      - name: Add and sync Android platform
        working-directory: apps/android
        run: |
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android
          node scripts/apply-branding.mjs

      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store_pass="${ANDROID_RELEASE_KEYSTORE_PASSWORD:-}"
          key_pass="${ANDROID_RELEASE_KEY_PASSWORD:-}"
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ] || [ -z "$store_pass" ] || [ -z "$key_pass" ]; then
            echo "::error::Release keystore secrets are required"
            exit 1
          fi
          if [ "$store_pass" = "$key_pass" ]; then
            echo "::warning::Store and key passwords are equal; rotation is still supported"
          fi
          umask 077
          install -d -m 700 "$HOME/.android"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/plutao-release.jks"
          chmod 600 "$HOME/.android/plutao-release.jks"
          keytool -list -keystore "$HOME/.android/plutao-release.jks" -storepass "$store_pass" -alias plutao > /dev/null
          keytool -list -v -keystore "$HOME/.android/plutao-release.jks" -storepass "$store_pass" -alias plutao | grep -E "SHA1:|SHA256:"

      - name: Configure release signing and version
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store_pass="${ANDROID_RELEASE_KEYSTORE_PASSWORD:-}"
          key_pass="${ANDROID_RELEASE_KEY_PASSWORD:-}"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=plutao\nkeyPassword=%s\n' \
            "$HOME/.android/plutao-release.jks" "$store_pass" "$key_pass" \
            > apps/android/android/release-keystore.properties
          python3 apps/android/scripts/configure-release-build.py
          echo "Release Gradle config prepared for version $VERSION_NAME (code $VERSION_CODE)"

      - name: Build release APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Generate release metadata and checksums
        id: metadata
        env:
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_DATE: ${{ github.event.head_commit.timestamp || '' }}
        run: |
          set -euo pipefail
          export RELEASE_DATE="${RELEASE_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          python3 apps/android/scripts/write-release-metadata.py

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME#${APK_NAME}" release-metadata.json#release-metadata.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Plutão $VERSION_NAME" --notes "Plutão $VERSION_NAME"
          else
            gh release create "$TAG" "$APK_NAME#${APK_NAME}" release-metadata.json#release-metadata.json \
              --repo "$GITHUB_REPOSITORY" --title "Plutão $VERSION_NAME" --notes "Plutão $VERSION_NAME"
          fi

      - name: Remove signing material
        if: always()
        run: rm -f apps/android/android/release-keystore.properties "$HOME/.android/plutao-release.jks"
