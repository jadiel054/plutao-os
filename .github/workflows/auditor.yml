# Auditor read-only — estrutura + higiene de voz de produto.
# Não acessa tokens de usuário nem Neon de produção.
name: Auditor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required paths exist
        run: |
          set -e
          test -f apps/web/package.json
          test -f packages/domain/package.json
          test -f packages/db/package.json
          test -f docs/CURRENT_STATE.md
          test -f docs/DECISIONS.md
          test -f docs/DESIGN_SYSTEM.md
          test -f packages/db/drizzle/0004_connectors.sql
          test -f apps/web/src/lib/runtime/tools/dispatcher.ts
          test -f apps/web/src/lib/runtime/tools/github.ts
          test -f apps/web/src/app/ajuda/page.tsx
          test -f apps/web/src/app/legal/termos/page.tsx
          test -f apps/web/src/app/legal/privacidade/page.tsx
          test -f apps/web/src/app/legal/licencas/page.tsx
          echo "structure OK"

      - name: No forbidden AI marketing strings in user-facing product pages
        run: |
          set -e
          # Só superfície de usuário (ajuda, legal, components de settings).
          # Docs de arquitetura internas podem mencionar stacks técnicos.
          TARGETS="apps/web/src/app/ajuda apps/web/src/app/legal apps/web/src/components"
          if grep -RIn --include='*.tsx' --include='*.ts' \
            -e 'ChatGPT' -e 'created by Grok' -e 'powered by Claude' -e 'powered by ChatGPT' \
            $TARGETS 2>/dev/null | head -20; then
            echo "Found forbidden third-party AI marketing strings in product UI"
            exit 1
          fi
          echo "brand hygiene OK"
