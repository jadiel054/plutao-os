name: apply-credentials-security
on:
  push:
    paths:
      - "tmp/TRIGGER_CREDENTIALS_SECURITY"
    branches:
      - main
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply credentials security
        run: |
          set -euo pipefail
          mkdir -p apps/web/src/lib/security
          cp tmp/credentials-security/credentials.ts apps/web/src/lib/security/credentials.ts
          python3 tmp/credentials-security/page_sec.py
          python3 tmp/credentials-security/route_sec.py
          git config user.name "plutao-bot"
          git config user.email "bot@plutao.local"
          git add apps/web/src/lib/security/credentials.ts "apps/web/src/app/(app)/chat/page.tsx" apps/web/src/app/api/chat/route.ts
          git commit -m "feat(security): mascarar credenciais no chat, alertar revogacao, prompt seguro"
          git push origin HEAD:main
