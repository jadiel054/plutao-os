name: android-diag2

on:
  push:
    branches: [vibe/agentic-core-phase2]

permissions:
  pull-requests: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          set -o pipefail
          cd apps/android
          npm ci --workspaces=false --include=dev 2>&1 | tee /tmp/s1.log > /dev/null
      - name: Comment install log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/s1.log > /tmp/c1.txt
          gh pr comment 209 --body-file /tmp/c1.txt || true

      - name: Add Android platform
        run: |
          set -o pipefail
          cd apps/android
          ./node_modules/.bin/cap add android 2>&1 | tee /tmp/s2.log > /dev/null
      - name: Comment add log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/s2.log > /tmp/c2.txt
          gh pr comment 209 --body-file /tmp/c2.txt || true

      - name: Sync Capacitor
        run: |
          set -o pipefail
          cd apps/android
          ./node_modules/.bin/cap sync android 2>&1 | tee /tmp/s3.log > /dev/null
      - name: Comment sync log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/s3.log > /tmp/c3.txt
          gh pr comment 209 --body-file /tmp/c3.txt || true

      - name: Apply branding
        run: |
          set -o pipefail
          cd apps/android
          node scripts/apply-branding.mjs 2>&1 | tee /tmp/s4.log > /dev/null
      - name: Comment branding log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/s4.log > /tmp/c4.txt
          gh pr comment 209 --body-file /tmp/c4.txt || true

      - name: Restore pinned debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -o pipefail
          {
            store_pass="${ANDROID_DEBUG_KEYSTORE_PASSWORD:-android}"
            key_pass="${ANDROID_DEBUG_KEY_PASSWORD:-android}"
            if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
              echo "SECRET_MISSING"
              exit 1
            fi
            umask 077
            install -d -m 700 "$HOME/.android"
            printf "%s" "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass "$store_pass" -alias androiddebugkey > /dev/null
            echo "KEYSTORE_OK"
          } 2>&1 | tee /tmp/s5.log > /dev/null
      - name: Comment keystore log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 2000 /tmp/s5.log > /tmp/c5.txt
          gh pr comment 209 --body-file /tmp/c5.txt || true

      - name: Configure Gradle debug signing
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -o pipefail
          {
            store_pass="${ANDROID_DEBUG_KEYSTORE_PASSWORD:-android}"
            key_pass="${ANDROID_DEBUG_KEY_PASSWORD:-android}"
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=androiddebugkey\nkeyPassword=%s\n" "$HOME/.android/debug.keystore" "$store_pass" "$key_pass" > apps/android/android/debug-keystore.properties
            python3 apps/android/scripts/configure-debug-signing.py
            echo "SIGNING_CONFIG_OK"
          } 2>&1 | tee /tmp/s6.log > /dev/null
      - name: Comment signing log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/s6.log > /tmp/c6.txt
          gh pr comment 209 --body-file /tmp/c6.txt || true

      - name: Build debug APK
        run: |
          set -o pipefail
          cd apps/android/android
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee /tmp/s7.log > /dev/null
      - name: Comment gradle log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/s7.log > /tmp/c7.txt
          gh pr comment 209 --body-file /tmp/c7.txt || true
