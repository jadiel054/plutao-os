name: Appium Android regression
on:
  workflow_dispatch:
    inputs:
      actions_json:
        {
          description: Allowlisted action JSON array,
          required: true,
          type: string,
        }
      nonce: { required: true, type: string }
      device_serial: { required: true, type: string }
      device_tailnet_name: { required: true, type: string }
run-name: Appium ${{ inputs.nonce }}
permissions: { contents: read }
concurrency:
  group: mobile-device-${{ inputs.device_serial }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACTIONS_JSON: ${{ inputs.actions_json }}
      DEVICE_SERIAL: ${{ inputs.device_serial }}
      DEVICE_TAILNET: ${{ inputs.device_tailnet_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Install Android, Appium and driver
        run: |
          sudo apt-get update
          sudo apt-get install -y adb openjdk-17-jdk
          npm install --no-save appium@2 webdriverio@9
          npx appium driver install uiautomator2
      - name: Connect device and start server
        run: |
          adb start-server
          adb connect "$DEVICE_TAILNET:5555"
          for i in $(seq 1 10); do adb -s "$DEVICE_SERIAL" get-state 2>/dev/null | grep -q device && break || sleep 2; done
          adb -s "$DEVICE_SERIAL" get-state | grep -q device
          npx appium --address 127.0.0.1 --port 4723 --log-level info > out-appium.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4723/status && break || sleep 2; done
      - name: Execute actions
        run: node scripts/mobile/appium-runner.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-${{ inputs.nonce }}
          path: |
            out
            out-appium.log
          if-no-files-found: warn
          retention-days: 7
