name: Durable runtime worker
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe durable runtime health
        env:
          APP_URL: https://plutao-os.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          status=$(curl --silent --show-error --output /tmp/runtime-worker-health.json --write-out '%{http_code}' \
            --request GET "$APP_URL/api/cron/runtime-worker/health" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header 'Accept: application/json')
          cat /tmp/runtime-worker-health.json
          test "$status" = "200"
          python3 - <<'PY'
          import json

          with open("/tmp/runtime-worker-health.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload.get("ok") is True
          queue = payload.get("queue") or {}
          counts = queue.get("counts") or {}
          required = {"pending", "running", "waitingApproval", "succeeded", "failed", "cancelled"}
          assert required.issubset(counts), f"missing queue counters: {required - set(counts)}"
          assert isinstance(queue.get("expiredRunningLeases"), int)
          print(f"queue health OK: counts={counts}, expiredRunningLeases={queue['expiredRunningLeases']}")
          PY
      - name: Process durable runtime jobs
        env:
          APP_URL: https://plutao-os.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          status=$(curl --silent --show-error --output /tmp/runtime-worker.json --write-out '%{http_code}' \
            --request POST "$APP_URL/api/cron/runtime-worker" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header 'Accept: application/json')
          cat /tmp/runtime-worker.json
          test "$status" = "200"
