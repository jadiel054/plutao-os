name: Durable runtime worker
on:
  schedule:
    # Every 2 minutes — reduces silent queue stall between missions
    - cron: "*/2 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe durable runtime health
        env:
          APP_URL: https://plutao-os.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          status=$(curl --silent --show-error --output /tmp/runtime-worker-health.json --write-out '%{http_code}' \
            --request GET "$APP_URL/api/cron/runtime-worker/health" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header 'Accept: application/json')
          cat /tmp/runtime-worker-health.json
          test "$status" = "200"
          python3 - <<'PY'
          import json

          with open("/tmp/runtime-worker-health.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload.get("ok") is True
          queue = payload.get("queue") or {}
          counts = queue.get("counts") or {}
          required = {"pending", "running", "waitingApproval", "succeeded", "failed", "cancelled"}
          assert required.issubset(counts), f"missing queue counters: {required - set(counts)}"
          assert isinstance(queue.get("expiredRunningLeases"), int)
          pending = int(counts.get("pending") or 0)
          waiting = int(counts.get("waitingApproval") or 0)
          print(f"queue health OK: counts={counts}, expiredRunningLeases={queue['expiredRunningLeases']}")
          if pending > 0:
              print(f"WARN: {pending} job(s) PENDING — worker step will claim")
          if waiting > 0:
              print(f"INFO: {waiting} job(s) WAITING_APPROVAL — need human gate")
          PY
      - name: Process durable runtime jobs
        env:
          APP_URL: https://plutao-os.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          # Process up to 3 batches per cron tick to drain backlog faster
          for i in 1 2 3; do
            status=$(curl --silent --show-error --output /tmp/runtime-worker.json --write-out '%{http_code}' \
              --request POST "$APP_URL/api/cron/runtime-worker" \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header 'Accept: application/json')
            cat /tmp/runtime-worker.json
            test "$status" = "200"
            processed=$(python3 -c "import json; d=json.load(open('/tmp/runtime-worker.json')); print(len(d.get('processed') or []))")
            echo "batch $i processed=$processed"
            if [ "$processed" = "0" ]; then
              echo "queue drained"
              break
            fi
          done
