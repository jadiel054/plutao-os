name: Durable runtime worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Process durable runtime jobs
        env:
          APP_URL: https://plutao-os.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          status=$(curl --silent --show-error --output /tmp/runtime-worker.json --write-out '%{http_code}' \
            --request POST "$APP_URL/api/cron/runtime-worker" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header 'Accept: application/json')
          cat /tmp/runtime-worker.json
          test "$status" = "200"
