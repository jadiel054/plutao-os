name: restore-chat-files
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore page and route from good commit
        run: |
          set -e
          GOOD=6e088e47ad0cebf327c82f21c13657eae313dbdb
          git checkout "$GOOD" -- "apps/web/src/app/(app)/chat/page.tsx" "apps/web/src/app/api/chat/route.ts"
          bytes=$(wc -c < "apps/web/src/app/(app)/chat/page.tsx")
          echo "page bytes=$bytes"
          test "$bytes" -gt 1000
          bytes2=$(wc -c < "apps/web/src/app/api/chat/route.ts")
          echo "route bytes=$bytes2"
          test "$bytes2" -gt 1000
          git config user.name "plutao-restore"
          git config user.email "restore@plutao.local"
          git add "apps/web/src/app/(app)/chat/page.tsx" "apps/web/src/app/api/chat/route.ts"
          git commit -m "fix(chat): restaura page.tsx e route.ts do commit 6e088e47 (código real)"
          git push origin HEAD:main
