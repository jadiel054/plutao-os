name: fix-restore-ui
on:
  push:
    paths:
      - "tmp/TRIGGER_FIX_RESTORE_UI"
    branches:
      - main
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore files from good commit
        run: |
          set -euo pipefail
          git show fdb315f1f611617832442c047b3f38b6b910c4be:apps/web/src/components/SettingsConnectorsSection.tsx > apps/web/src/components/SettingsConnectorsSection.tsx
          git show fdb315f1f611617832442c047b3f38b6b910c4be:apps/web/src/components/ConnectorsSheet.tsx > apps/web/src/components/ConnectorsSheet.tsx
          wc -c apps/web/src/components/SettingsConnectorsSection.tsx apps/web/src/components/ConnectorsSheet.tsx
          # Patch sheet onToggle for vercel
          python3 << 'PY'
          from pathlib import Path
          sp = Path("apps/web/src/components/ConnectorsSheet.tsx")
          st = sp.read_text()
          old = '''  function onToggle(c: ConnectorPublicView) {
    if (c.provider !== "github") return;
    if (c.status === "connected") void disconnectGitHub();
    else void connectGitHub();
  }'''
          new = '''  const [vercelPanel, setVercelPanel] = useState(false);
  const [vercelToken, setVercelToken] = useState("");

  async function disconnectVercel() {
    setBusy("vercel-disc");
    try {
      const res = await fetch("/api/connectors/vercel/disconnect", { method: "POST" });
      if (res.ok) {
        onNotifyRef.current?.("Vercel desconectado", "success");
        await load();
      }
    } finally {
      setBusy(null);
    }
  }

  async function connectVercelToken() {
    const token = vercelToken.trim();
    if (token.length < 20) {
      onNotifyRef.current?.("Token inválido", "error");
      return;
    }
    setBusy("vercel-token");
    try {
      const res = await fetch("/api/connectors/vercel/connect-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        onNotifyRef.current?.(typeof data.error === "string" ? data.error : "Falha", "error");
        return;
      }
      setVercelToken("");
      setVercelPanel(false);
      onNotifyRef.current?.(`Vercel conectado${data.accountLogin ? ` · @${data.accountLogin}` : ""}`, "success");
      await load();
    } finally {
      setBusy(null);
    }
  }

  function onToggle(c: ConnectorPublicView) {
    if (c.provider === "github") {
      if (c.status === "connected") void disconnectGitHub();
      else void connectGitHub();
      return;
    }
    if (c.provider === "vercel") {
      if (c.status === "connected") void disconnectVercel();
      else setVercelPanel(true);
    }
  }'''
          if old in st:
              st = st.replace(old, new, 1)
          st = st.replace(
              "onClick={() => void connectGitHub()}\n            className=\"flex items-center gap-3 w-full rounded-2xl bg-[var(--base)]/80 border border-[var(--border)] px-4 py-3.5 text-sm text-[var(--text-primary)] hover:border-[var(--selo)]/40 transition-colors disabled:opacity-40\"",
              "onClick={() => setVercelPanel(true)}\n            className=\"flex items-center gap-3 w-full rounded-2xl bg-[var(--base)]/80 border border-[var(--border)] px-4 py-3.5 text-sm text-[var(--text-primary)] hover:border-[var(--selo)]/40 transition-colors\"",
          )
          if "Conectar Vercel" not in st and "vercelPanel" in st:
              st = st.replace(
                  "{loading ? (",
                  "{vercelPanel ? (\n          <div className=\"mb-4 rounded-2xl border border-[var(--border)] p-4 space-y-3\">\n            <div className=\"flex justify-between\"><p className=\"text-sm font-medium\">Conectar Vercel</p><button type=\"button\" className=\"text-[11px] text-[var(--text-muted)]\" onClick={() => setVercelPanel(false)}>Fechar</button></div>\n            <p className=\"text-[11px] text-[var(--text-muted)]\">Token em <a href=\"https://vercel.com/account/tokens\" target=\"_blank\" rel=\"noopener noreferrer\" className=\"text-[var(--selo)] underline\">account/tokens</a></p>\n            <input type=\"password\" autoComplete=\"off\" value={vercelToken} onChange={(e) => setVercelToken(e.target.value)} placeholder=\"Access Token\" className=\"w-full rounded-xl border border-[var(--border)] bg-[var(--base)] px-3 py-2.5 text-sm font-mono\" />\n            <button type=\"button\" disabled={busy !== null || !oauthReady.crypto} onClick={() => void connectVercelToken()} className=\"w-full py-2.5 rounded-xl bg-[var(--selo)] text-[var(--base)] text-sm font-semibold disabled:opacity-40\">{busy === \"vercel-token\" ? \"Conectando…\" : \"Conectar\"}</button>\n          </div>\n        ) : null}\n\n        {loading ? (",
                  1,
              )
          # relax toggle disable for vercel
          st = st.replace(
              "(c.provider === \"github\" &&\n                        !on &&\n                        (!oauthReady.github || !oauthReady.crypto))",
              "(!on && c.provider === \"github\" && (!oauthReady.github || !oauthReady.crypto))",
          )
          sp.write_text(st)
          print("sheet ok", "vercelPanel" in st)

          # Settings: inject vercel buttons after github block
          p = Path("apps/web/src/components/SettingsConnectorsSection.tsx")
          t = p.read_text()
          if "connectVercelToken" not in t:
              fns = '''
  const [vercelToken, setVercelToken] = useState("");
  const [showVercelToken, setShowVercelToken] = useState(false);

  async function connectVercelToken() {
    const token = vercelToken.trim();
    if (token.length < 20) {
      onNotifyRef.current?.("Cole um Access Token válido", "error");
      return;
    }
    setBusy("vercel-token");
    try {
      const res = await fetch("/api/connectors/vercel/connect-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        onNotifyRef.current?.(typeof data.error === "string" ? data.error : "Falha Vercel", "error");
        return;
      }
      setVercelToken("");
      setShowVercelToken(false);
      onNotifyRef.current?.(`Vercel conectado${data.accountLogin ? ` · @${data.accountLogin}` : ""}`, "success");
      await load();
    } catch {
      onNotifyRef.current?.("Erro de rede", "error");
    } finally {
      setBusy(null);
    }
  }

  async function disconnectVercel() {
    setBusy("vercel-disc");
    try {
      const res = await fetch("/api/connectors/vercel/disconnect", { method: "POST" });
      if (res.ok) {
        onNotifyRef.current?.("Vercel desconectado", "success");
        await load();
      }
    } finally {
      setBusy(null);
    }
  }

'''
              t = t.replace("  if (loading) {", fns + "  if (loading) {", 1)
              vercel_ui = '''
                {c.provider === "vercel" && c.status !== "connected" ? (
                  <button type="button" disabled={busy !== null || !oauthReady.crypto} onClick={() => setShowVercelToken(true)} className="px-3 py-1.5 rounded-xl bg-[var(--selo)] text-[var(--base)] text-[11px] font-semibold disabled:opacity-40">Conectar</button>
                ) : null}
                {c.provider === "vercel" && c.status === "connected" ? (
                  <>
                    <button type="button" disabled={busy !== null} onClick={() => setShowVercelToken(true)} className="px-3 py-1.5 rounded-xl border border-[var(--border)] text-[11px]">Reconectar</button>
                    <button type="button" disabled={busy !== null} onClick={() => void disconnectVercel()} className="px-3 py-1.5 rounded-xl border border-red-500/40 text-red-300 text-[11px]">Desconectar</button>
                  </>
                ) : null}
'''
              t = t.replace(
                  "                ) : null}\n              </div>\n            </div>\n\n            {c.capabilities",
                  "                ) : null}\n" + vercel_ui + "              </div>\n            </div>\n\n            {c.provider === \"vercel\" && showVercelToken ? (\n              <div className=\"rounded-xl border border-[var(--border)] p-3 space-y-2\">\n                <p className=\"text-[11px] text-[var(--text-muted)]\">Token em <a href=\"https://vercel.com/account/tokens\" target=\"_blank\" rel=\"noopener noreferrer\" className=\"text-[var(--selo)] underline\">account/tokens</a></p>\n                <input type=\"password\" autoComplete=\"off\" value={vercelToken} onChange={(e) => setVercelToken(e.target.value)} placeholder=\"Access Token\" className=\"w-full rounded-xl border border-[var(--border)] bg-[var(--base)] px-3 py-2 text-sm font-mono\" />\n                <button type=\"button\" disabled={busy !== null} onClick={() => void connectVercelToken()} className=\"px-3 py-1.5 rounded-xl bg-[var(--selo)] text-[var(--base)] text-[11px] font-semibold\">{busy === \"vercel-token\" ? \"…\" : \"Salvar e conectar\"}</button>\n              </div>\n            ) : null}\n\n            {c.capabilities",
                  1,
              )
              p.write_text(t)
              print("settings ok", "connectVercelToken" in t)
          PY
          git config user.name "plutao-bot"
          git config user.email "bot@plutao.local"
          git add apps/web/src/components/SettingsConnectorsSection.tsx apps/web/src/components/ConnectorsSheet.tsx
          git commit -m "fix(connectors): restaura UI + Vercel toggle/token/Adicionar"
          git push origin HEAD:main
