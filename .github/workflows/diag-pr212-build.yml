name: Diag PR 212 build (temporário — remover)

on:
  push:
    branches: [feat/chat-build-durable-agent]

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tee /tmp/install.log

      - name: Test
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/test.log

      - name: Build web
        run: |
          set -o pipefail
          npm run build -w apps/web 2>&1 | tee /tmp/build.log
        env:
          NODE_ENV: production

      - name: Publish failure log to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq ".[0].number" || true)
          if [ -z "$PR" ]; then exit 0; fi
          for f in /tmp/install.log /tmp/test.log /tmp/build.log; do
            if [ -f "$f" ]; then
              echo "===== $f (tail) =====" >> /tmp/fail.txt
              tail -c 5000 "$f" >> /tmp/fail.txt
              echo >> /tmp/fail.txt
            fi
          done
          gh pr comment "$PR" --body-file /tmp/fail.txt || true