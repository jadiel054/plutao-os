name: wire-vercel-chat
on:
  push:
    paths:
      - "tmp/TRIGGER_WIRE_VERCEL_CHAT"
    branches:
      - main
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch chat route
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("apps/web/src/app/api/chat/route.ts")
          t = p.read_text()

          if "detectAndExecuteVercelTool" not in t:
              t = t.replace(
                  'import { detectAndExecuteGitHubTool, type GitHubToolExecutionResult } from "@/lib/chat/githubToolRunner";',
                  'import { detectAndExecuteGitHubTool, type GitHubToolExecutionResult } from "@/lib/chat/githubToolRunner";\nimport { detectAndExecuteVercelTool, type VercelToolExecutionResult } from "@/lib/chat/vercelToolRunner";',
                  1,
              )

          old_gh = '''    let githubConnected = false;
    let githubLogin: string | null = null;
    try {
      const token = await getAccessToken(user.id, "github");
      githubConnected = Boolean(token);
      if (githubConnected) {
        const row = await getConnectorRow(user.id, "github");
        githubLogin = row?.accountLogin ?? null;
      }
    } catch {
      /* connector table may be missing until migration 0004 */
    }'''

          new_conn = '''    let githubConnected = false;
    let githubLogin: string | null = null;
    let vercelConnected = false;
    let vercelLogin: string | null = null;
    let vercelToken: string | null = null;
    try {
      const token = await getAccessToken(user.id, "github");
      githubConnected = Boolean(token);
      if (githubConnected) {
        const row = await getConnectorRow(user.id, "github");
        githubLogin = row?.accountLogin ?? null;
      }
      vercelToken = await getAccessToken(user.id, "vercel");
      vercelConnected = Boolean(vercelToken);
      if (vercelConnected) {
        const vrow = await getConnectorRow(user.id, "vercel");
        vercelLogin = vrow?.accountLogin ?? null;
      }
    } catch {
      /* connector table may be missing until migration 0004 */
    }'''

          if old_gh in t and "vercelConnected" not in t:
              t = t.replace(old_gh, new_conn, 1)

          # system prompt capabilities block — find github-only version
          if "Vercel: CONECTADO" not in t and "runtimeCapabilities" in t:
              # replace the githubConnected ternary for capabilities
              import re
              # simpler string replace of known snippet
              marker = "const runtimeCapabilities = githubConnected"
              if marker in t:
                  idx = t.find(marker)
                  # find end of assignment (next const or blank with semicolon end)
                  # take until "\n\n" after template
                  end = t.find(";\n", idx)
                  # might be multi-line template - find matching
                  chunk = t[idx:idx+800]
                  # replace whole block heuristically
                  new_caps = '''const connectedLines: string[] = [];
    if (githubConnected) {
      connectedLines.push(`- GitHub: CONECTADO${githubLogin ? ` (@${githubLogin})` : ""}. Tools: repos_list, repo_get, issues_list, issues_get, pulls_list, actions_list.`);
    } else {
      connectedLines.push("- GitHub: desconectado.");
    }
    if (vercelConnected) {
      connectedLines.push(`- Vercel: CONECTADO${vercelLogin ? ` (@${vercelLogin})` : ""}. Tools: projects_list, deployments_list, deployment_get. Use quando o usuário pedir projetos/deploys Vercel.`);
    } else {
      connectedLines.push("- Vercel: desconectado.");
    }
    const runtimeCapabilities = connectedLines.length
      ? `Conectores no runtime (só use tools dos conectados):\n${connectedLines.join("\n")}`
      : "Nenhum conector ativo.";'''
                  # find full old assignment - from marker to next "const " at line start after
                  rest = t[idx:]
                  # end at double newline after closing backtick or semicolon
                  m = re.search(r'const runtimeCapabilities = githubConnected[\s\S]*?;\n', rest)
                  if m:
                      t = t[:idx] + new_caps + "\n" + rest[m.end():]
                      print("replaced runtimeCapabilities")
                  else:
                      print("could not regex runtimeCapabilities")
                      print(repr(rest[:200]))

          # helper to inject vercel tool execution after github tool blocks
          def inject_vercel_after_github(src: str) -> str:
              # after github tool exec, add vercel
              needle = "if (githubConnected) {\n      githubToolExec = await detectAndExecuteGitHubTool"
              if "vercelToolExec" in src:
                  return src
              # stream path and non-stream path both use similar patterns
              # Pattern 1: let githubToolExec ... if (githubConnected) { githubToolExec = await
              src2 = src
              # Add vercelToolExec declaration next to github
              src2 = src2.replace(
                  "let githubToolExec: GitHubToolExecutionResult = { executed: false };",
                  "let githubToolExec: GitHubToolExecutionResult = { executed: false };\n            let vercelToolExec: VercelToolExecutionResult = { executed: false };",
              )
              # also non-stream with less indent
              src2 = src2.replace(
                  "    let githubToolExec: GitHubToolExecutionResult = { executed: false };\n            let vercelToolExec",
                  "    let githubToolExec: GitHubToolExecutionResult = { executed: false };\n    let vercelToolExec",
              )
              # After each github detectAndExecute block, add vercel
              insert = '''
            if (vercelConnected && vercelToken) {
              vercelToolExec = await detectAndExecuteVercelTool({
                text: lastUserText,
                userText: lastUserText,
                accessToken: vercelToken,
                accountLogin: vercelLogin,
              });
            }
'''
              # find all occurrences of detectAndExecuteGitHubTool closing });
              import re
              pattern = r'(githubToolExec = await detectAndExecuteGitHubTool\(\{[\s\S]*?\}\);\n)'
              def repl(m):
                  return m.group(1) + insert
              src2 = re.sub(pattern, repl, src2)
              # inject context from vercel like github
              if "vercelToolExec.executed && vercelToolExec.contextText" not in src2:
                  src2 = src2.replace(
                      "if (githubToolExec.executed && githubToolExec.contextText) {",
                      "if (vercelToolExec.executed && vercelToolExec.contextText) {\n              payloadMessages.push({\n                role: \"system\",\n                content: vercelToolExec.contextText,\n              });\n            }\n            if (githubToolExec.executed && githubToolExec.contextText) {",
                  )
                  # streaming path may use different variable name - modelMessages
                  src2 = src2.replace(
                      "if (githubToolExec.executed && githubToolExec.contextText) {\n              modelMessages",
                      "if (vercelToolExec.executed && vercelToolExec.contextText) {\n              modelMessages.push({\n                role: \"system\",\n                content: vercelToolExec.contextText,\n              });\n            }\n            if (githubToolExec.executed && githubToolExec.contextText) {\n              modelMessages",
                  )
              # connectors payload
              src2 = src2.replace(
                  "connectors: { github: githubConnected },",
                  "connectors: { github: githubConnected, vercel: vercelConnected },",
              )
              return src2

          t = inject_vercel_after_github(t)

          # fix streaming path - messages array name
          if "vercelToolExec.executed && vercelToolExec.contextText" in t:
              # ensure push targets exist
              pass

          p.write_text(t)
          print("vercelConnected", t.count("vercelConnected"))
          print("detectAndExecuteVercel", t.count("detectAndExecuteVercelTool"))
          print("Vercel: CONECTADO", "Vercel: CONECTADO" in t)
          PY
          # syntax check
          node --check "apps/web/src/app/api/chat/route.ts" 2>&1 || true
          git config user.name "plutao-bot"
          git config user.email "bot@plutao.local"
          git add "apps/web/src/app/api/chat/route.ts"
          git commit -m "feat(chat): runtime Vercel tools + snapshot multi-conector"
          git push origin HEAD:main
