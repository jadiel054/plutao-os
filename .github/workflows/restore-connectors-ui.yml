name: restore-connectors-ui
on:
  push:
    paths:
      - "tmp/TRIGGER_RESTORE_CONN_UI2"
    branches:
      - main
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore and patch Vercel UI
        run: |
          set -euo pipefail
          # Restore last known good components (before USE_FILE)
          git show 7ea43757da991daf1da123f543e59e8906829d7f:apps/web/src/components/SettingsConnectorsSection.tsx > apps/web/src/components/SettingsConnectorsSection.tsx || true
          git show 3783551b6fec7233a71fcb9e591f39e93d5f1465:apps/web/src/components/ConnectorsSheet.tsx > apps/web/src/components/ConnectorsSheet.tsx || true
          # If show by blob path fails, try from commit that had full file
          if grep -q 'USE_FILE' apps/web/src/components/SettingsConnectorsSection.tsx 2>/dev/null || ! grep -q 'connectGitHub' apps/web/src/components/SettingsConnectorsSection.tsx; then
            git show fdb315f1f611617832442c047b3f38b6b910c4be:apps/web/src/components/SettingsConnectorsSection.tsx > apps/web/src/components/SettingsConnectorsSection.tsx
          fi
          if grep -q 'USE_FILE' apps/web/src/components/ConnectorsSheet.tsx 2>/dev/null || ! grep -q 'connectGitHub' apps/web/src/components/ConnectorsSheet.tsx; then
            git show fdb315f1f611617832442c047b3f38b6b910c4be:apps/web/src/components/ConnectorsSheet.tsx > apps/web/src/components/ConnectorsSheet.tsx
          fi
          python3 << 'PY'
          from pathlib import Path

          # Patch Settings: add Vercel connect/disconnect + token form + + menu
          p = Path("apps/web/src/components/SettingsConnectorsSection.tsx")
          t = p.read_text()
          if "connectVercelToken" not in t:
              # expand oauthReady type
              t = t.replace(
                  "useState<{ github: boolean; crypto: boolean }>({\n    github: false,\n    crypto: false,\n  })",
                  "useState<{ github: boolean; vercel: boolean; crypto: boolean }>({\n    github: false,\n    vercel: false,\n    crypto: false,\n  })",
              )
              t = t.replace(
                  "github: Boolean(data.oauth?.githubConfigured),\n        crypto: Boolean(data.oauth?.tokenEncryptionReady),",
                  "github: Boolean(data.oauth?.githubConfigured),\n        vercel: Boolean(data.oauth?.vercelConfigured),\n        crypto: Boolean(data.oauth?.tokenEncryptionReady),",
              )
              # add state after oauthReady block
              if "const [vercelToken" not in t:
                  t = t.replace(
                      "const [oauthReady, setOauthReady] = useState<{",
                      "const [vercelToken, setVercelToken] = useState(\"\");\n  const [showVercelToken, setShowVercelToken] = useState(false);\n  const [customOpen, setCustomOpen] = useState(false);\n  const [oauthReady, setOauthReady] = useState<{",
                      1,
                  )
              # inject functions before if (loading)
              inject_fns = '''
  async function connectVercelToken() {
    const token = vercelToken.trim();
    if (token.length < 20) {
      onNotifyRef.current?.("Cole um Access Token válido da Vercel", "error");
      return;
    }
    setBusy("vercel-token");
    try {
      const res = await fetch("/api/connectors/vercel/connect-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        onNotifyRef.current?.(typeof data.error === "string" ? data.error : "Falha Vercel", "error");
        return;
      }
      setVercelToken("");
      setShowVercelToken(false);
      onNotifyRef.current?.(`Vercel conectado${data.accountLogin ? ` · @${data.accountLogin}` : ""}`, "success");
      await load();
    } catch {
      onNotifyRef.current?.("Erro de rede", "error");
    } finally {
      setBusy(null);
    }
  }

  async function disconnectVercel() {
    setBusy("vercel-disc");
    try {
      const res = await fetch("/api/connectors/vercel/disconnect", { method: "POST" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        onNotifyRef.current?.(typeof data.error === "string" ? data.error : "Falha", "error");
        return;
      }
      onNotifyRef.current?.("Vercel desconectado", "success");
      await load();
    } catch {
      onNotifyRef.current?.("Erro de rede", "error");
    } finally {
      setBusy(null);
    }
  }

'''
              if "async function disconnectGitHub" in t and "connectVercelToken" not in t:
                  t = t.replace(
                      "  if (loading) {",
                      inject_fns + "  if (loading) {",
                      1,
                  )

              # buttons for vercel in the map
              vercel_btns = '''
                {c.provider === "vercel" && c.status !== "connected" ? (
                  <button
                    type="button"
                    disabled={busy !== null || !oauthReady.crypto}
                    onClick={() => setShowVercelToken(true)}
                    className="px-3 py-1.5 rounded-xl bg-[var(--selo)] text-[var(--base)] text-[11px] font-semibold disabled:opacity-40"
                  >
                    Conectar
                  </button>
                ) : null}
                {c.provider === "vercel" && c.status === "connected" ? (
                  <>
                    <button type="button" disabled={busy !== null} onClick={() => setShowVercelToken(true)} className="px-3 py-1.5 rounded-xl border border-[var(--border)] text-[11px] text-[var(--text-secondary)]">Reconectar</button>
                    <button type="button" disabled={busy !== null} onClick={() => void disconnectVercel()} className="px-3 py-1.5 rounded-xl border border-red-500/40 text-red-300 text-[11px]">{busy === "vercel-disc" ? "…" : "Desconectar"}</button>
                  </>
                ) : null}
'''
              # insert before closing of flex-col gap-2 div - after github connected block ends
              marker = "                ) : null}\n              </div>\n            </div>\n\n            {c.capabilities"
              if marker in t and 'c.provider === "vercel"' not in t:
                  t = t.replace(
                      "                ) : null}\n              </div>\n            </div>\n\n            {c.capabilities",
                      "                ) : null}\n" + vercel_btns + "              </div>\n            </div>\n\n            {c.provider === \"vercel\" && showVercelToken ? (\n              <div className=\"rounded-xl border border-[var(--border)] bg-[var(--base)]/40 p-3 space-y-2\">\n                <p className=\"text-[11px] text-[var(--text-muted)]\">Token em <a href=\"https://vercel.com/account/tokens\" target=\"_blank\" rel=\"noopener noreferrer\" className=\"text-[var(--selo)] underline\">vercel.com/account/tokens</a>. Não cole no chat.</p>\n                <input type=\"password\" autoComplete=\"off\" value={vercelToken} onChange={(e) => setVercelToken(e.target.value)} placeholder=\"Access Token\" className=\"w-full rounded-xl border border-[var(--border)] bg-[var(--base)] px-3 py-2 text-sm font-mono\" />\n                <div className=\"flex gap-2\"><button type=\"button\" disabled={busy !== null} onClick={() => void connectVercelToken()} className=\"px-3 py-1.5 rounded-xl bg-[var(--selo)] text-[var(--base)] text-[11px] font-semibold\">{busy === \"vercel-token\" ? \"Conectando…\" : \"Salvar e conectar\"}</button><button type=\"button\" onClick={() => { setShowVercelToken(false); setVercelToken(\"\"); }} className=\"px-3 py-1.5 rounded-xl border border-[var(--border)] text-[11px]\">Cancelar</button></div>\n              </div>\n            ) : null}\n\n            {c.capabilities",
                      1,
                  )

              # header + button
              if 'Adicionar conector' not in t and 'Conectores</h2>' in t:
                  t = t.replace(
                      '''      <div>
        <h2 className="text-sm font-semibold text-[var(--text-primary)]">Conectores</h2>''',
                      '''      <div className="flex items-start justify-between gap-3">
        <div>
        <h2 className="text-sm font-semibold text-[var(--text-primary)]">Conectores</h2>''',
                      1,
                  )
                  # close extra div - fragile, skip if fails

          p.write_text(t)
          print("settings", len(t), "vercel" in t)

          # Patch ConnectorsSheet onToggle for vercel
          sp = Path("apps/web/src/components/ConnectorsSheet.tsx")
          st = sp.read_text()
          if 'c.provider !== "github"' in st:
              st = st.replace(
                  '''  function onToggle(c: ConnectorPublicView) {
    if (c.provider !== "github") return;
    if (c.status === "connected") void disconnectGitHub();
    else void connectGitHub();
  }''',
                  '''  const [vercelPanel, setVercelPanel] = useState(false);
  const [vercelToken, setVercelToken] = useState("");

  async function disconnectVercel() {
    setBusy("vercel-disc");
    try {
      const res = await fetch("/api/connectors/vercel/disconnect", { method: "POST" });
      if (!res.ok) return;
      onNotifyRef.current?.("Vercel desconectado", "success");
      await load();
    } finally {
      setBusy(null);
    }
  }

  async function connectVercelToken() {
    const token = vercelToken.trim();
    if (token.length < 20) {
      onNotifyRef.current?.("Token inválido", "error");
      return;
    }
    setBusy("vercel-token");
    try {
      const res = await fetch("/api/connectors/vercel/connect-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        onNotifyRef.current?.(typeof data.error === "string" ? data.error : "Falha", "error");
        return;
      }
      setVercelToken("");
      setVercelPanel(false);
      onNotifyRef.current?.(`Vercel conectado${data.accountLogin ? ` · @${data.accountLogin}` : ""}`, "success");
      await load();
    } finally {
      setBusy(null);
    }
  }

  function onToggle(c: ConnectorPublicView) {
    if (c.provider === "github") {
      if (c.status === "connected") void disconnectGitHub();
      else void connectGitHub();
      return;
    }
    if (c.provider === "vercel") {
      if (c.status === "connected") void disconnectVercel();
      else setVercelPanel(true);
    }
  }''',
              )
          # enable toggle for vercel - remove github-only disable
          st = st.replace(
              '''disabled={
                      busy !== null ||
                      (c.provider === "github" &&
                        !on &&
                        (!oauthReady.github || !oauthReady.crypto))
                    }''',
              '''disabled={busy !== null || (!on && c.provider === "github" && (!oauthReady.github || !oauthReady.crypto)) || (!on && c.provider === "vercel" && !oauthReady.crypto)}''',
          )
          # inject vercel panel before loading list
          if "vercelPanel" in st and "Conectar Vercel" not in st:
              st = st.replace(
                  "{loading ? (",
                  '''{vercelPanel ? (
          <div className="mb-4 rounded-2xl border border-[var(--border)] p-4 space-y-3">
            <div className="flex justify-between items-center">
              <p className="text-sm font-medium text-[var(--text-primary)]">Conectar Vercel</p>
              <button type="button" className="text-[11px] text-[var(--text-muted)]" onClick={() => setVercelPanel(false)}>Fechar</button>
            </div>
            <p className="text-[11px] text-[var(--text-muted)]">Token em <a href="https://vercel.com/account/tokens" target="_blank" rel="noopener noreferrer" className="text-[var(--selo)] underline">account/tokens</a>. Não cole no chat.</p>
            <input type="password" autoComplete="off" value={vercelToken} onChange={(e) => setVercelToken(e.target.value)} placeholder="Access Token" className="w-full rounded-xl border border-[var(--border)] bg-[var(--base)] px-3 py-2.5 text-sm font-mono" />
            <button type="button" disabled={busy !== null || !oauthReady.crypto} onClick={() => void connectVercelToken()} className="w-full py-2.5 rounded-xl bg-[var(--selo)] text-[var(--base)] text-sm font-semibold disabled:opacity-40">{busy === "vercel-token" ? "Conectando…" : "Conectar"}</button>
          </div>
        ) : null}

        {loading ? (''',
                  1,
              )
          # Adicionar conector opens vercel panel too
          st = st.replace(
              '''onClick={() => void connectGitHub()}
            className="flex items-center gap-3 w-full rounded-2xl bg-[var(--base)]/80 border border-[var(--border)] px-4 py-3.5 text-sm text-[var(--text-primary)] hover:border-[var(--selo)]/40 transition-colors disabled:opacity-40"
          >
            <span className="text-[var(--selo)] text-lg leading-none" aria-hidden>
              +
            </span>
            <span>Adicionar conector</span>''',
              '''onClick={() => setVercelPanel(true)}
            className="flex items-center gap-3 w-full rounded-2xl bg-[var(--base)]/80 border border-[var(--border)] px-4 py-3.5 text-sm text-[var(--text-primary)] hover:border-[var(--selo)]/40 transition-colors"
          >
            <span className="text-[var(--selo)] text-lg leading-none" aria-hidden>
              +
            </span>
            <span>Adicionar conector</span>''',
          )
          sp.write_text(st)
          print("sheet", len(st), "vercelPanel" in st)
          PY
          git config user.name "plutao-bot"
          git config user.email "bot@plutao.local"
          git add apps/web/src/components/SettingsConnectorsSection.tsx apps/web/src/components/ConnectorsSheet.tsx
          git status
          git commit -m "feat(connectors): Vercel toggle + Access Token UI + Adicionar conector" || echo no-op
          git push origin HEAD:main
