name: build-diagnostic

on:
  push:
    branches: [vibe/agentic-core-phase2]

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test (full)
        run: |
          npm run test 2>&1 | tail -200 > /tmp/t.txt || true
          cat /tmp/t.txt
          grep -E "FAIL|Test Files|Tests  " /tmp/t.txt | while read -r line; do echo "::error::$line"; done || true

      - name: Build web
        if: always()
        run: |
          set -o pipefail
          NODE_ENV=production npm run build -w apps/web 2>&1 | tail -200 > /tmp/b.txt || true
          cat /tmp/b.txt
          grep -iE "error|failed to compile|failed to build" /tmp/b.txt | head -40 | while read -r line; do echo "::error::$line"; done || true
