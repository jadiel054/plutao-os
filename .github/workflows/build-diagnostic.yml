name: build-diagnostic

on:
  push:
    branches: [vibe/agentic-core-phase2]

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

permissions:
  pull-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test (full)
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/t.txt > /dev/null

      - name: Comment test log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/t.txt > /tmp/x.txt
          gh pr comment 209 --body-file /tmp/x.txt || true

      - name: Build web
        run: |
          set -o pipefail
          NODE_ENV=production npm run build -w apps/web 2>&1 | tee /tmp/b.txt > /dev/null

      - name: Comment build log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/b.txt > /tmp/y.txt
          gh pr comment 209 --body-file /tmp/y.txt || true
