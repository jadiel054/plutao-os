name: apply-chat-payload

on:
  push:
    paths:
      - "tmp/TRIGGER_CHAT_PATCH"
    branches:
      - main

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch page and route
        run: |
          set -euo pipefail
          python3 -c "
          from pathlib import Path
          page_path = Path('apps/web/src/app/(app)/chat/page.tsx')
          route_path = Path('apps/web/src/app/api/chat/route.ts')
          page = page_path.read_text()
          route = route_path.read_text()
          a = 'setTimeout(() => textareaRef.current?.focus(), 50);'
          assert a in page, 'focus not found'
          page = page.replace(a, '// no auto-focus after send (mobile keyboard)', 1)
          b = '{recentMissions.length > 0 ? ('
          assert b in page, 'chips not found'
          page = page.replace(b, '{messages.length === 0 && recentMissions.length > 0 ? (', 1)
          c = 'Tom: profissional, direto, sem emojis decorativos nem linguagem genérica de assistente.'
          assert c in route, 'tom not found'
          d = 'Tom: sênior, profissional e direto. Sem emojis decorativos nem linguagem genérica de assistente. Não use rótulos de template como **Resumo:**, **Resultado:** ou **Próximos passos:** — escreva em prosa natural e objetiva.'
          route = route.replace(c, d, 1)
          page_path.write_text(page)
          route_path.write_text(route)
          print('ok', len(page), len(route))
          "
          git config user.name "plutao-bot"
          git config user.email "bot@plutao.local"
          git add "apps/web/src/app/(app)/chat/page.tsx" "apps/web/src/app/api/chat/route.ts"
          git commit -m "fix(chat): teclado sem auto-focus, chips só no vazio, tom sênior no prompt"
          git push origin HEAD:main
