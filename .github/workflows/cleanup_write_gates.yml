name: Cleanup expired write gates

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke write-gate reaper
        env:
          APP_URL: https://plutao-os.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          status=$(curl --silent --show-error --output /tmp/reaper.json --write-out '%{http_code}' \
            --request POST "$APP_URL/api/cron/cleanup-write-gates" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header 'Accept: application/json')
          cat /tmp/reaper.json
          test "$status" = "200"
